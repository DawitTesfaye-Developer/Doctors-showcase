<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTH MCH CENTER - Doctors Display Slider</title>
  <link rel="icon" type="image/png" href="https://z-cdn-media.chatglm.cn/files/f9160f0c-4faf-46ac-bfcf-d9aca75d1270.png?auth_key=1884900534-67b0268b44144af7b098f71f7c7ab833-0-add77187443bdc9073b7c304409eca53">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --secondary: #db2777;
      --secondary-light: #f472b6;
      --accent-blue: #60a5fa;
      --accent-pink: #f9a8d4;
      --dark: #070c24;
      --dark2: #0c1230;
    }

    body {
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: var(--dark);
    }

    .slider-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 15% 45%, rgba(219, 39, 119, 0.06) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 25%, rgba(30, 64, 175, 0.08) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 85%, rgba(244, 114, 182, 0.04) 0%, transparent 40%),
        linear-gradient(180deg, #050816 0%, #070c24 40%, #0c1230 100%);
    }

    .slider-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(30, 64, 175, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 64, 175, 0.015) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 0;
    }

    .slider-container::after {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      top: -25%;
      left: -25%;
      background: radial-gradient(circle at 50% 50%, rgba(219, 39, 119, 0.03), transparent 50%);
      animation: ambientDrift 22s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes ambientDrift {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(5%, 5%); }
      50% { transform: translate(-5%, 10%); }
      75% { transform: translate(5%, -5%); }
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      z-index: 0;
      animation: orbFloat 14s ease-in-out infinite;
    }

    .ambient-orb.orb1 {
      width: 500px;
      height: 500px;
      background: rgba(30, 64, 175, 0.07);
      top: -120px;
      left: -120px;
    }

    .ambient-orb.orb2 {
      width: 400px;
      height: 400px;
      background: rgba(219, 39, 119, 0.05);
      bottom: -120px;
      right: -80px;
      animation-delay: -5s;
    }

    .ambient-orb.orb3 {
      width: 300px;
      height: 300px;
      background: rgba(244, 114, 182, 0.04);
      top: 35%;
      right: 25%;
      animation-delay: -9s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(20px, -15px) scale(1.05); }
      66% { transform: translate(-15px, 20px) scale(0.95); }
    }

    .ecg-line {
      position: absolute;
      z-index: 1;
      opacity: 0.06;
    }

    .ecg-line svg { width: 100%; height: 100%; }

    .ecg-path {
      stroke: var(--secondary-light);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: ecgDraw 5s linear infinite;
    }

    .ecg-path-blue {
      stroke: var(--accent-blue);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: ecgDraw 5s linear infinite;
      animation-delay: -2.5s;
    }

    @keyframes ecgDraw {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      z-index: 1;
      animation: particleFloat 10s ease-in-out infinite;
    }

    .particle.pink { background: rgba(244, 114, 182, 0.2); }
    .particle.blue { background: rgba(96, 165, 250, 0.2); }

    @keyframes particleFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.15; }
      50% { transform: translateY(-30px) scale(1.1); opacity: 0.3; }
    }

    .floating-shape {
      position: absolute;
      z-index: 1;
      opacity: 0.04;
      animation: shapeFloat 14s ease-in-out infinite;
    }

    .floating-shape.pink { color: var(--secondary-light); }
    .floating-shape.blue { color: var(--accent-blue); }

    .floating-shape svg {
      width: 100%;
      height: 100%;
      animation: shapeSpin 30s linear infinite;
    }

    @keyframes shapeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    @keyframes shapeSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px;
      pointer-events: none;
    }

    /* FIXED: capped at 72px so it never overlaps doctor photos on any screen size */
    .top-logo {
      width: 72px;
      max-width: 72px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(219, 39, 119, 0.15)) drop-shadow(0 4px 12px rgba(30, 64, 175, 0.15));
      flex-shrink: 0;
    }

    .top-clock {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .clock-time {
      font-size: clamp(1.2rem, 1.6vw, 1.8rem);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.7);
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
    }

    .clock-date {
      font-size: clamp(0.55rem, 0.7vw, 0.75rem);
      font-weight: 500;
      color: rgba(255, 255, 255, 0.25);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .doctor-slide {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3vw;
      padding: 6vh 5vw 12vh;
      opacity: 0;
      transform: translateX(6%) scale(0.99);
      filter: blur(4px);
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease, filter 0.5s ease;
      z-index: 5;
      will-change: transform, opacity, filter;
    }

    .doctor-slide.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      filter: blur(0px);
    }

    .doctor-slide.exit {
      opacity: 0;
      transform: translateX(-6%) scale(0.99);
      filter: blur(4px);
    }

    .left-section {
      width: 44%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .photo-container {
      position: relative;
      width: min(36vw, 520px);
      height: min(42vw, 620px);
    }

    .photo-glow {
      position: absolute;
      inset: -20px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.1), rgba(219, 39, 119, 0.06));
      filter: blur(40px);
      animation: photoGlow 5s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes photoGlow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.03); }
    }

    .pulse-ring {
      position: absolute;
      inset: -10px;
      border-radius: 28px;
      border: 1px solid rgba(244, 114, 182, 0.15);
      z-index: 0;
      animation: sonarPulse 4s ease-out infinite;
      pointer-events: none;
    }

    .pulse-ring:nth-child(2) {
      animation-delay: 2s;
      border-color: rgba(96, 165, 250, 0.12);
    }

    .pulse-ring:nth-child(3) {
      animation-delay: 1s;
      border-color: rgba(244, 114, 182, 0.1);
    }

    @keyframes sonarPulse {
      0% { transform: scale(0.98); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    .photo-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      z-index: 1;
      border: 1px solid rgba(219, 39, 119, 0.15);
      box-shadow: 0 0 30px rgba(219, 39, 119, 0.08), 0 0 30px rgba(30, 64, 175, 0.08), 0 20px 50px rgba(0, 0, 0, 0.3);
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.12), rgba(219, 39, 119, 0.08));
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: contrast(1.02) saturate(1.05);
      transition: transform 4s ease, opacity 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .doctor-slide.active .photo-frame img {
      transform: scale(1.04);
    }

    .photo-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      transform: skewX(-25deg);
      z-index: 5;
      pointer-events: none;
    }

    .doctor-slide.active .photo-frame::before {
      animation: photoShimmer 1.5s ease-in-out 0.3s 1;
    }

    @keyframes photoShimmer {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    .photo-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(7, 12, 36, 0.4) 100%);
      z-index: 2;
    }

    .photo-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(3rem, 5vw, 5rem);
      font-weight: 800;
      color: rgba(255, 255, 255, 0.08);
      z-index: 0;
      letter-spacing: 4px;
      user-select: none;
    }

    .photo-ecg {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      height: 50px;
      z-index: 3;
      opacity: 0.5;
    }

    .photo-ecg svg { width: 100%; height: 100%; }

    .photo-ecg-path {
      stroke: var(--secondary-light);
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: ecgDraw 3.5s linear infinite;
      filter: drop-shadow(0 0 4px rgba(244, 114, 182, 0.4));
    }

    .speciality-badge {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #1e40af, #3b82f6, #db2777);
      color: white;
      padding: 12px 28px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(0.85rem, 1.2vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 2px;
      box-shadow: 0 8px 24px rgba(219, 39, 119, 0.2), 0 8px 24px rgba(30, 64, 175, 0.15);
      z-index: 4;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .speciality-badge:hover {
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 12px 32px rgba(219, 39, 119, 0.3), 0 12px 32px rgba(30, 64, 175, 0.2);
    }

    .speciality-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .speciality-icon svg { width: 20px; height: 20px; }

    .corner-deco {
      position: absolute;
      width: 24px;
      height: 24px;
      z-index: 3;
    }

    .corner-deco::before,
    .corner-deco::after {
      content: '';
      position: absolute;
      border-radius: 1px;
    }

    .corner-deco.tl { top: 12px; left: 12px; }
    .corner-deco.tl::before { width: 16px; height: 2px; top: 0; left: 0; background: rgba(96, 165, 250, 0.3); }
    .corner-deco.tl::after { width: 2px; height: 16px; top: 0; left: 0; background: rgba(96, 165, 250, 0.3); }

    .corner-deco.tr { top: 12px; right: 12px; }
    .corner-deco.tr::before { width: 16px; height: 2px; top: 0; right: 0; background: rgba(96, 165, 250, 0.3); }
    .corner-deco.tr::after { width: 2px; height: 16px; top: 0; right: 0; background: rgba(96, 165, 250, 0.3); }

    .corner-deco.bl { bottom: 12px; left: 12px; }
    .corner-deco.bl::before { width: 16px; height: 2px; bottom: 0; left: 0; background: rgba(244, 114, 182, 0.3); }
    .corner-deco.bl::after { width: 2px; height: 16px; bottom: 0; left: 0; background: rgba(244, 114, 182, 0.3); }

    .corner-deco.br { bottom: 12px; right: 12px; }
    .corner-deco.br::before { width: 16px; height: 2px; bottom: 0; right: 0; background: rgba(244, 114, 182, 0.3); }
    .corner-deco.br::after { width: 2px; height: 16px; bottom: 0; right: 0; background: rgba(244, 114, 182, 0.3); }

    .right-section {
      width: 50%;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding-right: 2vw;
    }

    .doctor-name {
      font-size: clamp(2.4rem, 4.5vw, 5rem);
      font-weight: 900;
      line-height: 1.05;
      word-break: break-word;
      color: #ffffff;
      margin-bottom: 16px;
      letter-spacing: -1px;
      position: relative;
    }

    .doctor-name .name-label {
      display: block;
      font-weight: 400;
      font-size: 0.4em;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 6px;
      opacity: 0.8;
      background: linear-gradient(90deg, var(--accent-blue), var(--secondary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .doctor-name .name-text {
      display: block;
      background: linear-gradient(90deg, #ffffff 0%, var(--secondary-light) 40%, var(--accent-blue) 70%, #ffffff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: nameShine 6s linear infinite;
    }

    @keyframes nameShine {
      to { background-position: 200% center; }
    }

    .doctor-name::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0%;
      height: 4px;
      background: linear-gradient(90deg, var(--secondary), var(--primary-light), var(--secondary-light));
      border-radius: 4px;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.1s;
      box-shadow: 0 0 10px rgba(219, 39, 119, 0.3), 0 0 10px rgba(30, 64, 175, 0.2);
    }

    .doctor-slide.active .doctor-name::after {
      width: 60%;
    }

    .doctor-title {
      font-size: clamp(1.2rem, 2vw, 2.2rem);
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(90deg, var(--secondary-light), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .doctor-title::before {
      content: '';
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, var(--secondary-light), transparent);
      border-radius: 3px;
      flex-shrink: 0;
    }

    .doctor-credentials {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .credential-card {
      background: rgba(30, 64, 175, 0.06);
      border: 1px solid rgba(30, 64, 175, 0.12);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: clamp(0.82rem, 1vw, 1.1rem);
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .credential-card:hover {
      background: rgba(30, 64, 175, 0.1);
      transform: translateY(-1px);
      border-color: rgba(219, 39, 119, 0.25);
    }

    .credential-card .cred-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--secondary-light);
      box-shadow: 0 0 6px rgba(244, 114, 182, 0.5);
      flex-shrink: 0;
    }

    .credential-card:nth-child(2) .cred-dot {
      background: var(--accent-blue);
      box-shadow: 0 0 6px rgba(96, 165, 250, 0.5);
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      font-size: clamp(0.75rem, 0.9vw, 1rem);
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--secondary-light), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-title::before {
      content: '';
      width: 30px;
      height: 2px;
      background: linear-gradient(90deg, var(--secondary-light), transparent);
      border-radius: 2px;
    }

    .section-title::after {
      content: '';
      width: 30px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-blue));
      border-radius: 2px;
    }

    .services {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .service-item {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.025);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      border: 1px solid rgba(30, 64, 175, 0.08);
      border-left: 3px solid var(--primary-light);
      padding: 16px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .service-item:hover {
      background: rgba(219, 39, 119, 0.05);
      border-color: rgba(219, 39, 119, 0.15);
      border-left-color: var(--secondary);
      transform: translateX(6px);
      box-shadow: 0 6px 20px rgba(219, 39, 119, 0.08);
    }

    .service-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.1), rgba(219, 39, 119, 0.08));
      border: 1px solid rgba(30, 64, 175, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--secondary-light);
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .service-item:hover .service-icon {
      background: linear-gradient(135deg, rgba(219, 39, 119, 0.15), rgba(30, 64, 175, 0.1));
      box-shadow: 0 0 12px rgba(244, 114, 182, 0.15);
      color: var(--accent-blue);
    }

    .service-icon svg { width: 18px; height: 18px; }

    .service-text {
      font-size: clamp(0.88rem, 1.2vw, 1.2rem);
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.4;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, var(--secondary), var(--primary-light), var(--accent-blue));
      z-index: 100;
      border-radius: 0 2px 2px 0;
      box-shadow: 0 0 8px rgba(219, 39, 119, 0.3), 0 0 8px rgba(30, 64, 175, 0.2);
      transition: none;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 40;
      width: clamp(44px, 3.5vw, 56px);
      height: clamp(44px, 3.5vw, 56px);
      border-radius: 50%;
      border: 1px solid rgba(219, 39, 119, 0.15);
      background: rgba(7, 12, 36, 0.5);
      backdrop-filter: blur(12px);
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.35s ease;
      pointer-events: all;
    }

    .nav-arrow:hover {
      background: rgba(219, 39, 119, 0.12);
      border-color: rgba(244, 114, 182, 0.35);
      color: var(--secondary-light);
      box-shadow: 0 0 20px rgba(244, 114, 182, 0.1);
      transform: translateY(-50%) scale(1.08);
    }

    .nav-arrow:active { transform: translateY(-50%) scale(0.95); }
    .nav-arrow svg { width: 20px; height: 20px; }
    .nav-arrow-left { left: clamp(16px, 2.5vw, 36px); }
    .nav-arrow-right { right: clamp(16px, 2.5vw, 36px); }

    .nav-dots {
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      gap: 12px;
      pointer-events: all;
    }

    .nav-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: none;
      padding: 0;
      background: rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-dot:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.2);
    }

    .nav-dot.active {
      background: linear-gradient(135deg, var(--secondary-light), var(--accent-blue));

        tl.fromTo(sectionTitle,
          { opacity: 0, y: 15 },
          { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.38
        );
      }

      if (services.length) {
        tl.fromTo(services,
          { opacity: 0, x: 15 },
          { opacity: 1, x: 0, stagger: 0.06, duration: 0.3, ease: 'power2.out' }, 0.46
        );
      }

      if (badge) {
        tl.fromTo(badge,
          { opacity: 0, y: 10, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: 'back.out(1.4)' }, 0.35
        );
      }
    }

    function startProgressLoop() {
      slideStartTime = performance.now();
      cancelAnimationFrame(progressRAF);

      function tick(now) {
        if (isPaused) {
          progressRAF = requestAnimationFrame(tick);
          return;
        }

        const elapsed = now - slideStartTime;
        const pct = Math.min((elapsed / slideDuration) * 100, 100);
        progressBar.style.width = pct + '%';

        if (elapsed >= slideDuration) {
          nextSlide();
          return;
        }

        progressRAF = requestAnimationFrame(tick);
      }

      progressRAF = requestAnimationFrame(tick);
    }

    function showSlide(index) {
      slides.forEach((slide) => {
        slide.classList.remove('active', 'exit');
      });
      slides[index].classList.add('active');
      updateCounter(index);
      updateDots(index);
      animateActiveSlide();
      startProgressLoop();
    }

    function goToSlide(index) {
      if (isTransitioning || index === current) return;
      isTransitioning = true;

      const oldSlide = slides[current];
      const newSlide = slides[index];

      newSlide.classList.add('active');
      oldSlide.classList.remove('active');
      oldSlide.classList.add('exit');

      current = index;
      updateCounter(current);
      updateDots(current);
      animateActiveSlide();
      startProgressLoop();

      setTimeout(() => {
        oldSlide.classList.remove('exit');
        isTransitioning = false;
      }, 700);
    }

    function nextSlide() {
      if (isTransitioning) return;
      const next = (current + 1) % slides.length;
      goToSlide(next);
    }

    function prevSlide() {
      if (isTransitioning) return;
      const prev = (current - 1 + slides.length) % slides.length;
      goToSlide(prev);
    }

    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('prevBtn').addEventListener('click', prevSlide);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
    });

    const container = document.querySelector('.slider-container');
    container.addEventListener('mouseenter', () => {
      isPaused = true;
      pausedTime = performance.now();
    });

    container.addEventListener('mouseleave', () => {
      isPaused = false;
      slideStartTime += (performance.now() - pausedTime);
    });

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clockTime').textContent = `${h}:${m}:${s}`;

      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      document.getElementById('clockDate').textContent =
        `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    showSlide(0);
  </script>
</body>
</html>
