<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTH MCH CENTER - Doctors Display Slider</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --secondary: #db2777;
      --secondary-light: #f472b6;
      --accent-blue: #60a5fa;
      --accent-pink: #f9a8d4;
      --dark: #070c24;
      --dark2: #0c1230;
    }

    body {
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: var(--dark);
    }

    .slider-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 15% 45%, rgba(219, 39, 119, 0.06) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 25%, rgba(30, 64, 175, 0.08) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 85%, rgba(244, 114, 182, 0.04) 0%, transparent 40%),
        linear-gradient(180deg, #050816 0%, #070c24 40%, #0c1230 100%);
    }

    .slider-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(30, 64, 175, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 64, 175, 0.015) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 0;
    }

    .slider-container::after {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      top: -25%;
      left: -25%;
      background: radial-gradient(circle at 50% 50%, rgba(219, 39, 119, 0.03), transparent 50%);
      animation: ambientDrift 22s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes ambientDrift {

      0%,
      100% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(5%, 5%);
      }

      50% {
        transform: translate(-5%, 10%);
      }

      75% {
        transform: translate(5%, -5%);
      }
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      z-index: 0;
      animation: orbFloat 14s ease-in-out infinite;
    }

    .ambient-orb.orb1 {
      width: 500px;
      height: 500px;
      background: rgba(30, 64, 175, 0.07);
      top: -120px;
      left: -120px;
    }

    .ambient-orb.orb2 {
      width: 400px;
      height: 400px;
      background: rgba(219, 39, 119, 0.05);
      bottom: -120px;
      right: -80px;
      animation-delay: -5s;
    }

    .ambient-orb.orb3 {
      width: 300px;
      height: 300px;
      background: rgba(244, 114, 182, 0.04);
      top: 35%;
      right: 25%;
      animation-delay: -9s;
    }

    @keyframes orbFloat {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(20px, -15px) scale(1.05);
      }

      66% {
        transform: translate(-15px, 20px) scale(0.95);
      }
    }

    .ecg-line {
      position: absolute;
      z-index: 1;
      opacity: 0.06;
    }

    .ecg-line svg {
      width: 100%;
      height: 100%;
    }

    .ecg-path {
      stroke: var(--secondary-light);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: ecgDraw 5s linear infinite;
    }

    .ecg-path-blue {
      stroke: var(--accent-blue);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: ecgDraw 5s linear infinite;
      animation-delay: -2.5s;
    }

    @keyframes ecgDraw {
      0% {
        stroke-dashoffset: 1200;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      z-index: 1;
      animation: particleFloat 10s ease-in-out infinite;
    }

    .particle.pink {
      background: rgba(244, 114, 182, 0.2);
    }

    .particle.blue {
      background: rgba(96, 165, 250, 0.2);
    }

    @keyframes particleFloat {

      0%,
      100% {
        transform: translateY(0) scale(1);
        opacity: 0.15;
      }

      50% {
        transform: translateY(-30px) scale(1.1);
        opacity: 0.3;
      }
    }

    .floating-shape {
      position: absolute;
      z-index: 1;
      opacity: 0.04;
      animation: shapeFloat 14s ease-in-out infinite;
    }

    .floating-shape.pink {
      color: var(--secondary-light);
    }

    .floating-shape.blue {
      color: var(--accent-blue);
    }

    .floating-shape svg {
      width: 100%;
      height: 100%;
      animation: shapeSpin 30s linear infinite;
    }

    @keyframes shapeFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-20px);
      }
    }

    @keyframes shapeSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .top-logo {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 50;
      width: clamp(65px, 7vw, 95px);
      height: auto;
      filter: drop-shadow(0 4px 20px rgba(219, 39, 119, 0.2)) drop-shadow(0 4px 16px rgba(30, 64, 175, 0.2));
    }

    .doctor-slide {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3vw;
      padding: 6vh 5vw 12vh;
      opacity: 0;
      transform: translateX(8%) scale(0.98);
      filter: blur(6px);
      transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 1s ease, filter 1s ease;
      z-index: 5;
    }

    .doctor-slide.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      filter: blur(0px);
    }

    .doctor-slide.exit {
      opacity: 0;
      transform: translateX(-8%) scale(0.98);
      filter: blur(6px);
    }

    .left-section {
      width: 44%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .photo-container {
      position: relative;
      width: min(36vw, 520px);
      height: min(42vw, 620px);
    }

    .photo-glow {
      position: absolute;
      inset: -20px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.1), rgba(219, 39, 119, 0.06));
      filter: blur(40px);
      animation: photoGlow 5s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes photoGlow {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.03);
      }
    }

    .pulse-ring {
      position: absolute;
      inset: -10px;
      border-radius: 28px;
      border: 1px solid rgba(244, 114, 182, 0.15);
      z-index: 0;
      animation: sonarPulse 4s ease-out infinite;
      pointer-events: none;
    }

    .pulse-ring:nth-child(2) {
      animation-delay: 2s;
      border-color: rgba(96, 165, 250, 0.12);
    }

    .pulse-ring:nth-child(3) {
      animation-delay: 1s;
      border-color: rgba(244, 114, 182, 0.1);
    }

    @keyframes sonarPulse {
      0% {
        transform: scale(0.98);
        opacity: 0.6;
      }

      100% {
        transform: scale(1.15);
        opacity: 0;
      }
    }

    .photo-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      z-index: 1;
      border: 1px solid rgba(219, 39, 119, 0.15);
      box-shadow: 0 0 30px rgba(219, 39, 119, 0.08), 0 0 30px rgba(30, 64, 175, 0.08), 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: contrast(1.02) saturate(1.05);
      transition: transform 10s ease;
    }

    .doctor-slide.active .photo-frame img {
      transform: scale(1.04);
    }

    .photo-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      transform: skewX(-25deg);
      z-index: 5;
      pointer-events: none;
    }

    .doctor-slide.active .photo-frame::before {
      animation: photoShimmer 2.5s ease-in-out 1.2s 1;
    }

    @keyframes photoShimmer {
      0% {
        left: -100%;
      }

      100% {
        left: 200%;
      }
    }

    .photo-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(7, 12, 36, 0.4) 100%);
      z-index: 2;
    }

    .photo-ecg {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      height: 50px;
      z-index: 3;
      opacity: 0.5;
    }

    .photo-ecg svg {
      width: 100%;
      height: 100%;
    }

    .photo-ecg-path {
      stroke: var(--secondary-light);
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: ecgDraw 3.5s linear infinite;
      filter: drop-shadow(0 0 4px rgba(244, 114, 182, 0.4));
    }

    .speciality-badge {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #1e40af, #3b82f6, #db2777);
      color: white;
      padding: 12px 28px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(0.85rem, 1.2vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 2px;
      box-shadow: 0 8px 24px rgba(219, 39, 119, 0.2), 0 8px 24px rgba(30, 64, 175, 0.15);
      z-index: 4;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .speciality-badge:hover {
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 12px 32px rgba(219, 39, 119, 0.3), 0 12px 32px rgba(30, 64, 175, 0.2);
    }

    .speciality-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .speciality-icon svg {
      width: 20px;
      height: 20px;
    }

    .corner-deco {
      position: absolute;
      width: 24px;
      height: 24px;
      z-index: 3;
    }

    .corner-deco::before,
    .corner-deco::after {
      content: '';
      position: absolute;
      border-radius: 1px;
    }

    .corner-deco.tl {
      top: 12px;
      left: 12px;
    }

    .corner-deco.tl::before {
      width: 16px;
      height: 2px;
      top: 0;
      left: 0;
      background: rgba(96, 165, 250, 0.3);
    }

    .corner-deco.tl::after {
      width: 2px;
      height: 16px;
      top: 0;
      left: 0;
      background: rgba(96, 165, 250, 0.3);
    }

    .corner-deco.tr {
      top: 12px;
      right: 12px;
    }

    .corner-deco.tr::before {
      width: 16px;
      height: 2px;
      top: 0;
      right: 0;
      background: rgba(96, 165, 250, 0.3);
    }

    .corner-deco.tr::after {
      width: 2px;
      height: 16px;
      top: 0;
      right: 0;
      background: rgba(96, 165, 250, 0.3);
    }

    .corner-deco.bl {
      bottom: 12px;
      left: 12px;
    }

    .corner-deco.bl::before {
      width: 16px;
      height: 2px;
      bottom: 0;
      left: 0;
      background: rgba(244, 114, 182, 0.3);
    }

    .corner-deco.bl::after {
      width: 2px;
      height: 16px;
      bottom: 0;
      left: 0;
      background: rgba(244, 114, 182, 0.3);
    }

    .corner-deco.br {
      bottom: 12px;
      right: 12px;
    }

    .corner-deco.br::before {
      width: 16px;
      height: 2px;
      bottom: 0;
      right: 0;
      background: rgba(244, 114, 182, 0.3);
    }

    .corner-deco.br::after {
      width: 2px;
      height: 16px;
      bottom: 0;
      right: 0;
      background: rgba(244, 114, 182, 0.3);
    }

    .right-section {
      width: 50%;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding-right: 2vw;
    }

    .doctor-name {
      font-size: clamp(2.4rem, 4.5vw, 5rem);
      font-weight: 900;
      line-height: 1.05;
      word-break: break-word;
      color: #ffffff;
      margin-bottom: 16px;
      letter-spacing: -1px;
      position: relative;
    }

    .doctor-name .name-label {
      display: block;
      font-weight: 400;
      font-size: 0.4em;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 6px;
      opacity: 0.8;
      background: linear-gradient(90deg, var(--accent-blue), var(--secondary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .doctor-name .name-text {
      display: block;
      background: linear-gradient(90deg, #ffffff 0%, var(--secondary-light) 40%, var(--accent-blue) 70%, #ffffff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: nameShine 6s linear infinite;
    }

    @keyframes nameShine {
      to {
        background-position: 200% center;
      }
    }

    .doctor-name::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0%;
      height: 4px;
      background: linear-gradient(90deg, var(--secondary), var(--primary-light), var(--secondary-light));
      border-radius: 4px;
      transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.4s;
      box-shadow: 0 0 10px rgba(219, 39, 119, 0.3), 0 0 10px rgba(30, 64, 175, 0.2);
    }

    .doctor-slide.active .doctor-name::after {
      width: 60%;
    }

    .doctor-title {
      font-size: clamp(1.2rem, 2vw, 2.2rem);
      font-weight: 600;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(25px);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(90deg, var(--secondary-light), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .doctor-title::before {
      content: '';
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, var(--secondary-light), transparent);
      border-radius: 3px;
      flex-shrink: 0;
    }

    .doctor-credentials {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .credential-card {
      background: rgba(30, 64, 175, 0.06);
      border: 1px solid rgba(30, 64, 175, 0.12);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: clamp(0.82rem, 1vw, 1.1rem);
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      opacity: 0;
      transform: translateY(25px);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .credential-card:hover {
      background: rgba(30, 64, 175, 0.1);
      transform: translateY(-1px);
      border-color: rgba(219, 39, 119, 0.25);
    }

    .credential-card .cred-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--secondary-light);
      box-shadow: 0 0 6px rgba(244, 114, 182, 0.5);
      flex-shrink: 0;
    }

    .credential-card:nth-child(2) .cred-dot {
      background: var(--accent-blue);
      box-shadow: 0 0 6px rgba(96, 165, 250, 0.5);
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      font-size: clamp(0.75rem, 0.9vw, 1rem);
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(25px);
      background: linear-gradient(90deg, var(--secondary-light), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-title::before {
      content: '';
      width: 30px;
      height: 2px;
      background: linear-gradient(90deg, var(--secondary-light), transparent);
      border-radius: 2px;
    }

    .section-title::after {
      content: '';
      width: 30px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-blue));
      border-radius: 2px;
    }

    .services {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .service-item {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.025);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      border: 1px solid rgba(30, 64, 175, 0.08);
      border-left: 3px solid var(--primary-light);
      padding: 16px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      opacity: 0;
      transform: translateY(25px);
    }

    .service-item:hover {
      background: rgba(219, 39, 119, 0.05);
      border-color: rgba(219, 39, 119, 0.15);
      border-left-color: var(--secondary);
      transform: translateX(6px);
      box-shadow: 0 6px 20px rgba(219, 39, 119, 0.08);
    }

    .service-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.1), rgba(219, 39, 119, 0.08));
      border: 1px solid rgba(30, 64, 175, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--secondary-light);
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .service-item:hover .service-icon {
      background: linear-gradient(135deg, rgba(219, 39, 119, 0.15), rgba(30, 64, 175, 0.1));
      box-shadow: 0 0 12px rgba(244, 114, 182, 0.15);
      color: var(--accent-blue);
    }

    .service-icon svg {
      width: 18px;
      height: 18px;
    }

    .service-text {
      font-size: clamp(0.88rem, 1.2vw, 1.2rem);
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.4;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--secondary), var(--primary-light), var(--accent-blue));
      z-index: 100;
      border-radius: 0 2px 2px 0;
      box-shadow: 0 0 8px rgba(219, 39, 119, 0.3), 0 0 8px rgba(30, 64, 175, 0.2);
    }

    @keyframes progress {
      from {
        width: 0%;
      }

      to {
        width: 100%;
      }
    }

    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3vw, 50px);
      padding: 16px 30px;
      background: linear-gradient(180deg, transparent, rgba(5, 8, 22, 0.9) 30%, rgba(5, 8, 22, 1));
      border-top: 1px solid rgba(219, 39, 119, 0.06);
      color: white;
      z-index: 30;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(0.7rem, 0.95vw, 0.95rem);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
      transition: color 0.3s ease;
    }

    .contact-item:hover {
      color: rgba(255, 255, 255, 0.8);
    }

    .contact-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(30, 64, 175, 0.08);
      border: 1px solid rgba(219, 39, 119, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--secondary-light);
      transition: all 0.3s ease;
    }

    .contact-item:hover .contact-icon {
      background: rgba(219, 39, 119, 0.12);
      box-shadow: 0 0 10px rgba(244, 114, 182, 0.12);
      color: var(--accent-blue);
    }

    .contact-icon svg {
      width: 14px;
      height: 14px;
    }

    .slide-counter {
      position: absolute;
      bottom: 80px;
      right: 40px;
      z-index: 30;
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.12);
      font-size: 0.85rem;
    }

    .slide-counter .current-num {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--secondary-light), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slide-counter .slash {
      margin: 0 4px;
      color: rgba(255, 255, 255, 0.08);
    }

    .doctor-slide.active .doctor-title {
      animation: fadeUp 0.8s ease forwards 0.35s;
    }

    .doctor-slide.active .credential-card:nth-child(1) {
      animation: fadeUp 0.8s ease forwards 0.55s;
    }

    .doctor-slide.active .credential-card:nth-child(2) {
      animation: fadeUp 0.8s ease forwards 0.7s;
    }

    .doctor-slide.active .section-title {
      animation: fadeUp 0.8s ease forwards 0.85s;
    }

    .doctor-slide.active .service-item:nth-child(1) {
      animation: fadeUp 0.8s ease forwards 0.95s;
    }

    .doctor-slide.active .service-item:nth-child(2) {
      animation: fadeUp 0.8s ease forwards 1.1s;
    }

    .doctor-slide.active .service-item:nth-child(3) {
      animation: fadeUp 0.8s ease forwards 1.25s;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1400px) {
      .doctor-slide {
        gap: 2vw;
      }

      .doctor-name {
        font-size: clamp(2rem, 3.8vw, 3.8rem);
      }

      .doctor-title {
        font-size: clamp(1.1rem, 1.8vw, 2rem);
      }
    }

    @media (max-width: 1100px) {
      body {
        overflow-y: auto;
      }

      .doctor-slide {
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        gap: 30px;
        padding: 110px 24px 180px;
        overflow-y: auto;
      }

      .left-section,
      .right-section {
        width: 100%;
        max-width: 600px;
        text-align: center;
      }

      .photo-container {
        width: min(70vw, 380px);

      }

      .right-section {
        align-items: center;
        padding-right: 0;
      }

      .doctor-name {
        line-height: 1.1;
      }

      .doctor-name::after {
        left: 50%;
        transform: translateX(-50%);
      }

      .doctor-title {
        justify-content: center;
      }

      .doctor-credentials {
        justify-content: center;
      }

      .services {
        width: 100%;
      }

      .service-item {
        width: 100%;
      }

      .section-title {
        justify-content: center;
      }

      .slide-counter {
        bottom: 70px;
        right: 20px;
      }

      .top-logo {
        top: 16px;
        left: 16px;
        width: 60px;
      }
    }

    @media (max-width: 768px) {
      .doctor-slide {
        padding: 90px 16px 200px;
        gap: 20px;
      }

      .photo-container {
        width: min(80vw, 320px);
        height: min(90vw, 360px);
      }

      .doctor-name {
        font-size: clamp(1.8rem, 8vw, 3rem);
        letter-spacing: -0.5px;
      }

      .doctor-title {
        font-size: clamp(1rem, 4.5vw, 1.6rem);

      .credential-card {

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <script>
    const specialtyIcons = {
      'CARDIOLOGY': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>',
      'PEDIATRICS': '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="6" r="4"/><path d="M12 12c-4 0-8 2-8 4v2h16v-2c0-2-4-4-8-4z"/></svg>',
      'GYNECOLOGY': '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="5"/><path d="M12 13v8M8 17h8"/></svg>',
      'NEUROLOGY': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 00-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 001 1h6a1 1 0 001-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 00-7-7zM9 21a1 1 0 001 1h4a1 1 0 001-1v-1H9v1z"/></svg>',
      'DERMATOLOGY': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>',
      'ORTHOPEDICS': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-6 18H6v-2h6v2zm0-4H6v-2h6v2zm0-4H6v-2h6v2zm6 8h-4v-2h4v2zm0-4h-4v-2h4v2zm0-4h-4v-2h4v2zm0-4H6V4h12v6z"/></svg>',
      'EMERGENCY CARE': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2v-2zm0-6h2v4h-2v-4z"/></svg>'
    };

    const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

    /* ── Doctor Data — Using YOUR uploaded photos ── */
    const doctors = [
      {
        name: 'Dr. Esubalew Demekirstos',
        title: 'Senior Obstetrician and Gynecologist',
        degree: 'MD OB/GYN',
        experience: '7+ Years Experience',
        speciality: 'OBSTETRICS & GYNECOLOGIST',
        image: './Images/Dr.Esubalew.JPG',
        services: ['Pregnancy Care', 'Reproductive Health', 'Preventive Care']
      },
      {
        name: 'Dr. Tsehaye Hagos',
        title: 'Expert Obstetrician and Gynecologist',
        degree: 'Assistant Professor for Obstetrics and Gynecologist',
        experience: '10+ Years Experience',
        speciality: 'OBSTETRICS & GYNECOLOGIST',
        image: './Images/Dr.TSEHAYE.JPG',
        services: ['Pregnancy Care', 'Reproductive Health', 'Preventive Care']
      },
      {
        name: 'Dr. Araya  Gebrehiwot',
        title: 'General practitioner(GP)',
        degree: 'Bsc in medicine',
        experience: '15+ Years Experience',
        image: './Images/Dr.Araya.JPG',
        services: ['Diagnostics & Prescription', 'patients manegment', 'followup']
      },
      {
        name: 'Dr. Alazar',
        title: 'Medical Director | Pediatric specialist',
        degree: '',
        experience: '5+ Years Experience',
        speciality: 'PEDIATRICS',
        image: './Images/Dr.Alazar.JPG',
        services: ['monday - saturday 8:00am - 5:00pm | Emergency pediatric Support', 'neonatal Care',]
      }
    ];

    const wrapper = document.getElementById('slides-wrapper');
    const counterEl = document.getElementById('slideCounter');

    doctors.forEach((doctor) => {
      const iconSvg = specialtyIcons[doctor.speciality] || specialtyIcons['CARDIOLOGY'];
      const slide = document.createElement('div');
      slide.className = 'doctor-slide';
      slide.innerHTML = `
        <div class="left-section">
          <div class="photo-container">
            <div class="photo-glow"></div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="photo-frame">
              <img src="${doctor.image}" alt="${doctor.name}" loading="lazy" />
              <div class="corner-deco tl"></div>
              <div class="corner-deco tr"></div>
              <div class="corner-deco bl"></div>
              <div class="corner-deco br"></div>
            </div>
            <div class="photo-ecg">
              <svg viewBox="0 0 800 50" preserveAspectRatio="none">
                <path class="photo-ecg-path" d="M0,25 L150,25 L170,25 L190,6 L210,44 L230,12 L250,38 L270,25 L400,25 L420,25 L440,8 L460,42 L480,14 L500,36 L520,25 L650,25 L670,25 L690,7 L710,43 L730,13 L750,37 L770,25 L800,25"/>
              </svg>
            </div>
            <div class="speciality-badge">
              <div class="speciality-icon">${iconSvg}</div>
              <div>${doctor.speciality}</div>
            </div>
          </div>
        </div>
        <div class="right-section">
          <div class="doctor-name">
            <span class="name-label">DOCTOR</span>
            <span class="name-text">${doctor.name}</span>
          </div>
          <div class="doctor-title">${doctor.title}</div>
          <div class="doctor-credentials">
            <div class="credential-card"><span class="cred-dot"></span>${doctor.degree}</div>
            <div class="credential-card"><span class="cred-dot"></span>${doctor.experience}</div>
          </div>
          <div class="section-title">Specialized Services</div>
          <div class="services">
            ${doctor.services.map(service => `
              <div class="service-item">
                <div class="service-icon">${checkSvg}</div>
                <div class="service-text">${service}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      wrapper.appendChild(slide);
    });

    const slides = document.querySelectorAll('.doctor-slide');
    const progressBar = document.getElementById('progressBar');
    const slideDuration = 17000;
    let current = 0;

    function updateCounter(idx) {
      const num = String(idx + 1).padStart(2, '0');
      const total = String(doctors.length).padStart(2, '0');
      counterEl.innerHTML = `<span class="current-num">${num}</span><span class="slash">/</span><span class="total-num">${total}</span>`;
    }

    function resetProgressBar() {
      progressBar.style.animation = 'none';
      void progressBar.offsetWidth;
      progressBar.style.animation = `progress ${slideDuration}ms linear forwards`;
    }

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.remove('active', 'exit');
        if (i === index) slide.classList.add('active');
      });
      updateCounter(index);
      resetProgressBar();
      animateActiveSlide();
    }

    function animateActiveSlide() {
      const active = document.querySelector('.doctor-slide.active');
      if (!active) return;
      const photoContainer = active.querySelector('.photo-container');
      const name = active.querySelector('.doctor-name');
      const services = active.querySelectorAll('.service-item');
      const badge = active.querySelector('.speciality-badge');
      const pulseRings = active.querySelectorAll('.pulse-ring');

      if (photoContainer) gsap.fromTo(photoContainer, { opacity: 0, scale: 0.96, x: -40 }, { opacity: 1, scale: 1, x: 0, duration: 1.2, ease: 'power2.out' });
      if (name) gsap.fromTo(name, { opacity: 0, y: 30, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1, ease: 'power2.out', delay: 0.15 });
      if (badge) gsap.fromTo(badge, { opacity: 0, y: 15, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: 'back.out(1.4)', delay: 0.7 });
      if (services.length) gsap.fromTo(services, { opacity: 0, x: 25 }, { opacity: 1, x: 0, stagger: 0.1, duration: 0.7, ease: 'power2.out', delay: 0.9 });
      if (pulseRings.length) gsap.fromTo(pulseRings, { opacity: 0 }, { opacity: 1, duration: 0.5, delay: 1.2 });
    }

    showSlide(current);

    setInterval(() => {
      slides[current].classList.remove('active');
      slides[current].classList.add('exit');
      current = (current + 1) % slides.length;
      setTimeout(() => { showSlide(current); }, 600);
    }, slideDuration);
  </script>
</body>
